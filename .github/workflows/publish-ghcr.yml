name: Publish fork image to GHCR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - frontend/**
      - backend/**
      - Dockerfile
      - .github/workflows/publish-ghcr.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository == 'vbabc/WatchYourLAN'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vbabc/watchyourlan:2.1.4-hardware-full
            ghcr.io/vbabc/watchyourlan:sha-${{ github.sha }}
            ghcr.io/vbabc/watchyourlan:latest
          labels: |
            org.opencontainers.image.source=https://github.com/vbabc/WatchYourLAN
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=2.1.4-hardware-full
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record published image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/vbabc/watchyourlan@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
